name: CI

on:
  push:
    branches:
      - main
      - "implementation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python, Django, data audit and browser logic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Django configuration and published data
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECRET_KEY: "ci-only-not-for-deployment"
        run: |
          python -m py_compile tools/build_clcd_district_series.py tools/build_chongqing_osm_layers.py
          python manage.py check
          python manage.py migrate --noinput
          python manage.py import_study
          python manage.py test study --verbosity 2
          python manage.py build_analysis --output outputs/ci-analysis
      - name: Audit source data, transitions and published evaluation
        run: python audit_study.py --output outputs/data-audit
      - name: Run spatial, evaluation and data-audit tests
        run: python -m unittest discover -s tests -v
      - name: Check new browser entry points and run browser analysis tests
        run: |
          node --check web/dashboard3d.js
          node --check web/guide.js
          node --check web/district.js
          node --check web/live.js
          node --check web/data-center.js
          node --test tests/test_client.cjs
      - name: Upload reproducibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cq-land-study-ci-reports
          path: |
            outputs/data-audit/
            outputs/ci-analysis/report.json
          if-no-files-found: ignore
          retention-days: 30

  container:
    name: Production container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cq-land-study:ci

      - name: Run container readiness smoke test
        run: |
          docker run --detach --rm --name cq-land-study-ci \
            -p 127.0.0.1:8000:8000 \
            -e DJANGO_SECRET_KEY=ci-runtime-only-secret \
            -e DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
            cq-land-study:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              docker stop cq-land-study-ci
              exit 0
            fi
            sleep 2
          done
          docker logs cq-land-study-ci
          exit 1
