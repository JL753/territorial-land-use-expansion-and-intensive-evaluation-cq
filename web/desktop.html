<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山城地研 · 桌面分析台</title><link rel="stylesheet" href="/desktop.css"><script defer src="/analysis.js"></script><script defer src="/client-utils.js"></script><script defer src="/desktop.js"></script></head>
<body><aside><img src="/icon192.png" alt=""><h1>山城地研</h1><p>桌面分析台</p><nav><button data-view="data" aria-current="page">区年数据</button><button data-view="work">评价方案</button><button data-view="sensitivity">敏感性扫描</button><button data-view="pairing">区县对照</button><a href="/">空间总览</a></nav><p id="desktop-status" role="status">正在读取数据…</p></aside>
<main><header><p>两江山城 · 重庆主城都市区 · 2010—2022</p><h2 id="desktop-title">区年数据</h2></header>
<section id="data"><div class="panel controls"><label>年份<select id="d-year"><option value="">全部年份</option></select></label><label>区组<select id="d-group"><option value="">全部区组</option><option>中心城区</option><option>主城新区</option></select></label><label>区名或代码<input id="d-search" type="search" placeholder="区名 / 代码"></label><label class="check"><input id="d-quality" type="checkbox">仅显示未标记待复核的记录</label><button id="d-export">导出筛选记录</button></div>
<div class="panel"><p id="d-count"></p><div class="scroll"><table><thead id="d-columns"></thead><tbody id="d-rows"></tbody></table></div></div></section>
<section id="work" hidden><div class="split"><article class="panel"><h3>试算设置</h3><label>评价样本<select id="d-basis"><option value="recent">2020、2022</option><option value="full">2010—2022</option></select></label><label>权重方案<select id="d-mode"><option value="entropy">熵权</option><option value="equal">等权</option><option value="custom">自定义权重</option></select></label><div id="d-weights"></div><label>查看年份<select id="d-rank-year"></select></label><label>方案名称<input id="d-name" maxlength="60" placeholder="例如 近期人口承载方案"></label><button id="d-save">保存方案</button><p id="d-message" role="status"></p></article>
<article class="panel"><h3>已保存方案</h3><p>选择两个方案，查看同一年份排名变化。方案保存在本机。</p><div class="controls"><label>方案 A<select id="d-a"></select></label><label>方案 B<select id="d-b"></select></label></div><p id="d-change-summary"></p><div id="d-delta"></div><div class="controls plan-tools"><button id="d-compare-export" disabled>导出方案差异</button><button id="d-delete" disabled>移除方案 B</button></div></article></div>
<div class="panel"><div class="controls"><h3>年度评价结果</h3><button id="d-export-rank">导出排名</button></div><div id="d-scores" class="scroll"></div></div></section>
<section id="pairing" hidden><div class="panel controls"><label>区县 A<select id="district-a"></select></label><label>区县 B<select id="district-b"></select></label><label>指标<select id="pair-metric"></select></label><button id="d-export-pair">导出四期差额</button></div><div class="panel"><h3 id="pair-title"></h3><div id="pair-table" class="scroll"></div></div></section><section id="sensitivity" hidden><div class="panel controls"><label>样本范围<select id="s-basis"><option value="recent">2020、2022</option><option value="full">2010—2022</option></select></label><label>观测年份<select id="s-year"></select></label><button id="s-run">运行权重扫描</button><button id="s-export" disabled>导出名次区间</button></div><div class="panel"><h3>区县名次区间</h3><p>以 10 个百分点为步长遍历三项权重，计算各区县可取得的最高、最低名次及进入前五的比例。</p><p id="s-result" role="status"></p><div id="s-table" class="scroll"></div></div></section></main></body></html>
