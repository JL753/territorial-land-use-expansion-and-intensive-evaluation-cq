<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143d39"><link rel="manifest" href="/mobile.webmanifest"><link rel="apple-touch-icon" href="/icon192.png"><title>山城地研 · 口袋区县档案</title><link rel="stylesheet" href="/mobile.css"><script defer src="/analysis.js"></script><script defer src="/client-utils.js"></script><script defer src="/mobile.js"></script></head>
<body><header><img src="/icon192.png" alt=""><span>山城地研</span><a href="/">网页总览</a></header>
<main><section id="explore"><div class="hero"><p>两江山城 · 重庆主城都市区</p><h1>口袋区县档案</h1><label for="find">按区名或行政代码查询</label><input id="find" type="search" placeholder="例如 渝北、500112"></div><div id="district-list" class="list"></div></section>
<section id="profile" hidden><div class="profile-head"><button id="back">返回区县</button><button id="review-toggle" aria-pressed="false">加入核对</button><button id="favorite" aria-pressed="false">收藏</button><p id="area"></p><h1 id="district-title"></h1><div id="years" aria-label="观测年份"></div></div><p id="quality" class="notice"></p><div id="tiles"></div><section class="paper"><h2>不透水面历年变化</h2><div id="history"></div><label for="mobile-base">对照年份</label><select id="mobile-base"></select><p id="mobile-change" aria-live="polite"></p></section><section class="paper"><h2>转入不透水面的主要地类</h2><div id="flow-mobile"></div></section><section class="paper"><h2>实地笔记</h2><label for="memo">仅保存在本设备</label><textarea id="memo" maxlength="2000" rows="3" placeholder="记录踏勘位置或待核实的问题"></textarea><p id="memo-status"></p><button id="export-profile">导出所选区县四期数据</button></section><details class="paper"><summary>来源与口径</summary><p id="sources"></p></details></section>
<section id="saved" hidden><h1>收藏的区县</h1><div id="favorites" class="list"></div></section>
<section id="review" hidden><h1>待核对清单</h1><div id="review-list" class="list"></div><button id="export-review" disabled>导出清单与笔记</button></section>
<section id="pocket-assistant" hidden><h1>口袋助手</h1><p>输入区县、年份、指标，或同时输入两个区县进行对照。</p><form id="mobile-ask"><label for="mobile-question">研究问题</label><input id="mobile-question" maxlength="400" required placeholder="例如 渝北区不透水面历年趋势"><button>查询数据</button></form><p id="mobile-answer" class="paper" aria-live="polite"></p></section>
<p id="mobile-status" role="status">正在读取研究数据…</p></main>
<nav aria-label="手机导航"><button data-mobile="explore" aria-current="page">⌕ 区县</button><button data-mobile="saved">☆ 收藏</button><button data-mobile="review">核对</button><button data-mobile="pocket-assistant">◇ 助手</button></nav></body></html>
